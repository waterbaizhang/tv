name: Sync to GitLab

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Add GitLab remote
        run: |
          # 关键：将 token 嵌入 URL，使用 oauth2 作为用户名（或 gitlab-ci-token）
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/a80815213/water.git

      - name: Push to GitLab
        run: |
          git push gitlab --all --force
          git push gitlab --tags --force
