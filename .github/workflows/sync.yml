name: Sync to GitLab

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Add GitLab remote
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/your-group/your-repo.git

      - name: Push to GitLab
        run: |
          git push gitlab --all --force
          git push gitlab --tags --force   # 单独推送标签，或者使用 --mirror 一次性推送所有内容
