name: Auto Merge Clash YAML

on:
  push:
    paths:
      - clash.txt        # ✅ clash.txt 更新时自动执行
  workflow_dispatch:     # ✅ 支持手动运行

permissions:
  contents: write        # ✅ 允许自动提交代码

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # ✅ 必须，否则无法 push

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Create temp folder
        run: mkdir downloads

      - name: Download YAMLs from clash.txt (skip errors)
        run: |
          while read url; do
            [ -z "$url" ] && continue
            filename="downloads/$(basename "$url")"
            echo "📥 Downloading $url"

            if curl -fSL "$url" -o "$filename"; then
              echo "✅ Downloaded: $filename"
            else
              echo "⚠️ Failed: $url — skipped"
              rm -f "$filename"
              continue
            fi
          done < clash.txt

      - name: Check downloaded files
        run: |
          if ! ls downloads/*.yaml 1> /dev/null 2>&1; then
            echo "❌ No valid YAML files downloaded — stopping workflow"
            exit 0
          fi

      - name: Add sequence numbers to - name
        run: |
          i=1
          for file in downloads/*.yaml; do
            echo "🔢 Processing $file"
            count=$(yq eval '.proxies | length' "$file" 2>/dev/null || echo 0)
