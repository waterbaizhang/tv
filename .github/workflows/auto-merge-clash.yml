name: Auto Merge Clash YAML

on:
  push:
    paths:
      - clash.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Create temp folder
        run: mkdir downloads

      - name: Download YAMLs from clash.txt
        run: |
          while read url; do
            [ -z "$url" ] && continue
            echo "Downloading $url"
            curl -L "$url" -o "downloads/$(basename "$url")"
          done < clash.txt

      - name: Add sequence numbers to - name
        run: |
          i=1
          for file in downloads/*.yaml; do
            echo "Processing $file"
            yq eval \
              ".proxies |= with(.[]; .name = \"${i}-\" + .name )" \
              -i "$file"
            i=$((i + 1))
          done

      - name: Merge YAMLs (no overwrite)
        run: |
          yq eval-all 'reduce .[] as $item ({}; . *? $item)' downloads/*.yaml \
            > clashgo.yaml
          echo "✅ merged into clashgo.yaml"

      - name: Commit & push result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add clashgo.yaml
          git commit -m "Auto update clashgo.yaml" || echo "No changes"
          git push
