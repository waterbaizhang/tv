name: Merge Clash YAML

on:
  push:
    paths:
      - clash.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Create temp directory
        run: mkdir sources

      - name: Read URLs from clash.txt and load YAML content
        run: |
          index=1
          while read url; do
            [ -z "$url" ] && continue
            echo "📥 Reading: $url"

            content=$(curl -fsSL "$url") || {
              echo "⚠️ Failed — skipped"
              continue
            }

            echo "$content" > "sources/$index.yaml"
            echo "✅ Loaded into sources/$index.yaml"
            index=$((index + 1))
          done < clash.txt

      - name: Merge YAML content
        run: |
          yq eval-all 'reduce .[] as $item ({}; . * $item)' sources/*.yaml > clashgo.yaml
          echo "✅ clashgo.yaml generated"

      - name: Push result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add clashgo.yaml
          git commit -m "Auto update clashgo.yaml" || echo "⚠️ No changes to commit"
          git push
