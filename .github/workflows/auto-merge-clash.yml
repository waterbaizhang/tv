name: Auto Merge Clash YAML

on:
  push:
    paths:
      - clash.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Create temp folder
        run: mkdir sources

      - name: Read YAML content from URLs (skip failures & clean URLs)
        run: |
          index=1
          while read url; do
            url=$(echo "$url" | xargs)
            [ -z "$url" ] && continue
            if [[ "$url" != http* ]]; then
              echo "⚠️ Invalid URL format: $url — skipped"
              continue
            fi

            echo "📥 Fetching $url"
            if content=$(curl -fsSL "$url"); then
              filename="sources/$index.yaml"
              echo "$content" > "$filename"
              echo "✅ Loaded into $filename"
              index=$((index + 1))
            else
              echo "⚠️ Failed to fetch $url — skipped"
            fi
          done < clash.txt

      - name: Check if any YAML loaded
        run: |
          if ! ls sources/*.yaml >/dev/null 2>&1; then
            echo "❌ No valid YAML content loaded — stopping workflow"
            exit 0
          fi

      - name: Number proxies.name per file
        run: |
          for file in sources/*.yaml; do
            count=$(yq eval '.proxies | length' "$file" 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              # 按顺序编号
              i=1
              for idx in $(seq 0 $((count - 1))); do
                yq eval ".proxies[$idx].name = \"${i}\"" -i "$file"
                i=$((i + 1))
              done
              echo "✅ Numbered proxies in $file"
            fi
          done

      - name: Merge YAMLs (no overwrite)
        run: |
          shopt -s nullglob
          files=(sources/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ No YAML files to merge — skipping"
            exit 0
          fi
          yq eval-all 'reduce .[] as $item ({}; . *? $item)' "${files[@]}" > clashgo.yaml
          echo "✅ Generated clashgo.yaml"

      - name: Commit & push result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add clashgo.yaml
          git commit -m "Auto update clashgo.yaml" || echo "⚠️ No changes"
          git push
