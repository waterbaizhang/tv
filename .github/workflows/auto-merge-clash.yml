name: Auto Merge Clash YAML

on:
  push:
    paths:
      - clash.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Create temp folder
        run: mkdir downloads

      - name: Download YAMLs from clash.txt (skip errors)
        run: |
          while read url; do
            [ -z "$url" ] && continue
            filename="downloads/$(basename "$url")"
            echo "Downloading $url"
            if curl -fSL "$url" -o "$filename"; then
              echo "Downloaded: $filename"
            else
              echo "Failed: $url — skipped"
              rm -f "$filename"
            fi
          done < clash.txt

      - name: Check downloaded files
        run: |
          if ! ls downloads/*.yaml >/dev/null 2>&1; then
            echo "No valid YAML files — stopping"
            exit 0
          fi

      - name: Add sequence numbers
        run: |
          i=1
          for file in downloads/*.yaml; do
            count=$(yq eval '.proxies | length' "$file" 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              yq eval ".proxies |= with(.[]; .name = \"${i}-\" + .name)" -i "$file"
              i=$((i + count))
            fi
          done

      - name: Merge YAMLs (no overwrite)
        run: |
          yq eval-all 'reduce .[] as $item ({}; . *? $item)' downloads/*.yaml > clashgo.yaml
          echo "Generated clashgo.yaml"

      - name: Commit & push result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add clashgo.yaml
          git commit -m "Auto update clashgo.yaml" || echo "No changes"
          git push