name: Sync to GitLab (HTTPS 100% 稳定版)

on:
  push:
    branches: [ '*' ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - run: git config --global --add safe.directory /github/workspace

      - name: Push to GitLab
        run: |
          git push \
            "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ secrets.GITLAB_HOST }}/${{ secrets.GITLAB_PROJECT }}.git" \
            --all --force --tags
