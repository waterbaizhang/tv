name: Sync to Private GitLab

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 修复权限问题
      - name: Fix git safe directory
        run: git config --global --add safe.directory /github/workspace

      # 直接推送到 GitLab（最稳定）
      - name: Push to GitLab
        run: |
          git remote add gitlab "${{ secrets.GITLAB_URL }}"
          git push gitlab --all --force --tags
