name: Sync to Private GitLab

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 修复权限问题
      - name: Fix git safe directory
        run: git config --global --add safe.directory /github/workspace

      # 添加 GitLab 远程仓库
      - name: Add GitLab remote
        run: git remote add gitlab "${{ secrets.GITLAB_URL }}"

      # 推送所有分支
      - name: Push all branches
        run: git push gitlab --all --force

      # 推送所有标签
      - name: Push all tags
        run: git push gitlab --tags --force
