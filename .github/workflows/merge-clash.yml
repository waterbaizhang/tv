name: Merge Clash Subscriptions

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: merge-clash-subscriptions
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML requests

      - name: Merge subscriptions
        env:
          PYTHONUTF8: "1"
        run: |
          cat > merge.py <<'PY'
          import ipaddress
          import re
          import socket
          import subprocess
          import time
          from pathlib import Path

          import requests
          import yaml

          URLS_FILE = Path("urls.txt")
          OUTPUT_FILE = Path("final.yaml")

          MANUAL_GROUP = "🚀 节点选择"
          AUTO_GROUP = "♻️ 自动选择"

          COUNTRY_NAMES = {
