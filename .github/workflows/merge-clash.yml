name: Merge Clash Subscriptions

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: merge-clash-subscriptions
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML requests

      - name: Merge subscriptions
        env:
          PYTHONUTF8: "1"
        run: |
          cat > merge.py <<'PY'
          import os
          import re
          import time
          import socket
          import ipaddress
          import subprocess
          from urllib.parse import urlparse

          import requests
          import yaml

          URLS_FILE = "urls.txt"
          OUTPUT_FILE = "final.yaml"

          SELECT_GROUP = "🚀 节点选择"
          COUNTRY_GROUP = "🌍 国家节点"
          GEOIP_URL = "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.dat"
          GEOSITE_URL = "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; ClashSubscriptionMerger/1.0)"
          })

          def unique(items):
              result = []
              seen = set()
              for item in items:
                  try:
                      key = yaml.safe_dump(
                          item, allow_unicode=True, sort_keys=True
                      ) if isinstance(item, (dict, list)) else str(item)
                  except Exception:
                      key = str(item)
                  if key not in seen:
                      seen.add(key)
                      result.append(item)
              return result

          def fetch_text(url):
              """优先 requests，多次重试；失败后用 curl 再试。"""
              for attempt in range(3):
                  try:
                      response = session.get(url, timeout=(10, 30))
                      response.raise_for_status()
                      text = response.text.lstrip("\ufeff")
                      if text.strip():
                          return text
                  except Exception as exc:
                      print(f"  requests 第 {attempt + 1} 次失败：{exc}")
                      time.sleep(1 + attempt)

              try:
                  result = subprocess.run(
                      ["curl", "-fLsS", "--retry", "2",
                       "--connect-timeout", "10", "--max-time", "40", url],
                      check=True, capture_output=True, text=True, encoding="utf-8"
                  )
                  if result.stdout.strip():
                      return result.stdout.lstrip("\ufeff")
              except Exception as exc:
                  print(f"  curl 下载失败：{exc}")

              return None

          def load_subscription(url):
              text = fetch_text(url)
              if not text:
                  return None
              try:
                  data = yaml.safe_load(text)
                  if isinstance(data, dict):
                      return data
              except Exception:
                  pass
              print("  内容不是有效的 YAML 配置，跳过。")
              return None

          def resolve_host(server):
              server = str(server or "").strip().strip("[]")
              if not server:
                  return None
              try:
                  return str(ipaddress.ip_address(server))
              except ValueError:
                  pass
              try:
                  return socket.gethostbyname(server)
              except Exception:
                  return None

          COUNTRY_NAMES = {
              "China": "中国",
              "Hong Kong": "香港",
              "Macao": "澳门",
              "Taiwan": "台湾",
              "Japan": "日本",
              "South Korea": "韩国",
              "Korea": "韩国",
              "Singapore": "新加坡",
              "United States": "美国",
              "United Kingdom": "英国",
              "Canada": "加拿大",
              "Australia": "澳大利亚",
              "New Zealand": "新西兰",
              "Germany": "德国",
              "France": "法国",
              "Netherlands": "荷兰",
              "Russia": "俄罗斯",
              "India": "印度",
              "Indonesia": "印度尼西亚",
              "Malaysia": "马来西亚",
              "Thailand": "泰国",
              "Vietnam": "越南",
              "Philippines": "菲律宾",
              "Turkey": "土耳其",
              "Switzerland": "瑞士",
              "Sweden": "瑞典",
              "Norway": "挪威",
              "Finland": "芬兰",
              "Italy": "意大利",
              "Spain": "西班牙",
              "Poland": "波兰",
              "Ukraine": "乌克兰",
              "Brazil": "巴西",
              "Argentina": "阿根廷",
              "Mexico": "墨西哥",
              "United Arab Emirates": "阿联酋",
              "Israel": "以色列",
              "South Africa": "南非",
              "Romania": "罗马尼亚",
              "Bulgaria": "保加利亚",
              "Czechia": "捷克",
              "Austria": "奥地利",
              "Belgium": "比利时",
              "Ireland": "爱尔兰",
              "Portugal": "葡萄牙",
              "Denmark": "丹麦",
              "Iceland": "冰岛",
              "Luxembourg": "卢森堡",
              "Estonia": "爱沙尼亚",
              "Latvia": "拉脱维亚",
              "Lithuania": "立陶宛",
              "Cyprus": "塞浦路斯",
              "Greece": "希腊",
              "Hungary": "匈牙利",
              "Slovakia": "斯洛伐克",
              "Slovenia": "斯洛文尼亚",
              "Croatia": "克罗地亚",
              "Serbia": "塞尔维亚",
              "Georgia": "格鲁吉亚",
              "Kazakhstan": "哈萨克斯坦",
              "Pakistan": "巴基斯坦",
              "Bangladesh": "孟加拉国",
              "Nepal": "尼泊尔",
              "Cambodia": "柬埔寨",
              "Laos": "老挝",
              "Myanmar": "缅甸",
              "Mongolia": "蒙古",
              "Chile": "智利",
              "Colombia": "哥伦比亚",
              "Peru": "秘鲁",
              "Panama": "巴拿马",
              "Costa Rica": "哥斯达黎加",
              "Nigeria": "尼日利亚",
              "Egypt": "埃及",
              "Saudi Arabia": "沙特阿拉伯",
              "Qatar": "卡塔尔",
              "Kuwait": "科威特",
              "Bahrain": "巴林",
              "Oman": "阿曼",
              "Jordan": "约旦",
              "Iraq": "伊拉克",
              "Iran": "伊朗",
              "Afghanistan": "阿富汗",
          }

          geo_cache = {}

          def country_of_server(server):
              ip = resolve_host(server)
              if not ip:
                  return "未知地区"
              if ip in geo_cache:
                  return geo_cache[ip]

              country = "未知地区"
              # ip-api 免费接口通常适用于低频查询；接口失败不影响合并流程。
              try:
                  response = session.get(
                      f"http://ip-api.com/json/{ip}",
                      params={"fields": "status,country"},
                      timeout=8,
                  )
                  data = response.json()
                  if data.get("status") == "success":
                      country = COUNTRY_NAMES.get(
                          data.get("country", ""), data.get("country", "未知地区")
                      )
              except Exception as exc:
                  print(f"  GeoIP 查询失败 {ip}：{exc}")

              geo_cache[ip] = country
              return country

          def node_server_key(node):
              return str(node.get("server", "")).strip().lower()

          def rename_nodes(nodes):
              """按 server 归属地命名；同一地区依次编号。"""
              counts = {}
              renamed = []
              for node in nodes:
                  node = dict(node)
                  country = country_of_server(node.get("server"))
                  counts[country] = counts.get(country, 0) + 1
                  index = counts[country]
                  node["name"] = (
                      country if index == 1 else f"{country} {index}"
                  )
                  renamed.append(node)
              return renamed

          def merge_proxy_groups(all_configs, node_names):
              groups = {}
              group_order = []

              for config in all_configs:
                  for group in config.get("proxy-groups", []) or []:
                      if not isinstance(group, dict) or not group.get("name"):
                          continue
                      name = str(group["name"])
                      if name not in groups:
                          groups[name] = dict(group)
                          groups[name]["proxies"] = list(
                              group.get("proxies", []) or []
                          )
                          group_order.append(name)
                      else:
                          current = groups[name]
                          for key, value in group.items():
                              if key == "proxies":
                                  current.setdefault("proxies", [])
                                  current["proxies"].extend(value or [])
                              elif key not in current:
                                  current[key] = value

              # 仅保留已存在的代理节点引用或已定义的代理组引用。
              known_names = set(node_names) | set(groups) | {"DIRECT", "REJECT", "PASS"}
              for group in groups.values():
                  refs = group.get("proxies", []) or []
                  group["proxies"] = unique([
                      ref for ref in refs
                      if isinstance(ref, str) and ref in known_names
                  ])

              # 将所有有效节点加入现有的 select 组，作为最终兜底代理组。
              candidates = [
                  name for name in group_order
                  if str(groups[name].get("type", "")).lower() == "select"
              ]

              if candidates:
                  fallback_target = candidates[0]
                  groups[fallback_target]["proxies"] = unique(
                      list(groups[fallback_target].get("proxies", []) or [])
                      + node_names
                  )
              else:
                  fallback_target = SELECT_GROUP
                  if fallback_target in groups:
                      fallback_target = "🚀 节点选择（自动）"
                  groups[fallback_target] = {
                      "name": fallback_target,
                      "type": "select",
                      "proxies": list(node_names) + ["DIRECT"],
                  }
                  group_order.append(fallback_target)

              # 额外生成国家分组，方便按国家选择节点。
              country_groups = {}
              for node_name in node_names:
                  match = re.match(r"^(.*?)(?:\s+\d+)?$", node_name)
                  country = match.group(1) if match else node_name
                  country_groups.setdefault(country, []).append(node_name)

              country_group_refs = []
              for country, members in country_groups.items():
                  group_name = f"{country}节点"
                  if group_name in groups:
                      groups[group_name]["proxies"] = unique(
                          list(groups[group_name].get("proxies", []) or []) + members
                      )
                  else:
                      groups[group_name] = {
                          "name": group_name,
                          "type": "select",
                          "proxies": members,
                      }
                      group_order.append(group_name)
                  country_group_refs.append(group_name)

              # 把国家分组放入总选择组，保留已有选项。
              groups[fallback_target]["proxies"] = unique(
                  list(groups[fallback_target].get("proxies", []) or [])
                  + country_group_refs
              )

              return [groups[name] for name in group_order], fallback_target

          def main():
              if not os.path.exists(URLS_FILE):
                  raise SystemExit("仓库根目录找不到 urls.txt，请先创建该文件。")

              with open(URLS_FILE, "r", encoding="utf-8-sig") as f:
                  urls = [
                      line.strip() for line in f
                      if line.strip() and not line.strip().startswith("#")
                  ]

              if not urls:
                  raise SystemExit("urls.txt 中没有可用订阅链接。")

              all_configs = []
              raw_nodes = []
              seen_servers = set()

              for index, url in enumerate(urls, 1):
                  print(f"[{index}/{len(urls)}] 下载订阅：{url}")
                  config = load_subscription(url)
                  if not config:
                      print("  来源不可用，跳过。")
                      continue

                  all_configs.append(config)
                  nodes = config.get("proxies", []) or []
                  accepted = 0

                  for node in nodes:
                      if not isinstance(node, dict) or not node.get("server"):
                          continue
                      key = node_server_key(node)
                      if not key or key in seen_servers:
                          continue
                      seen_servers.add(key)
                      raw_nodes.append(node)
                      accepted += 1

                  print(f"  收录节点：{accepted}")

              if not raw_nodes:
                  raise SystemExit(
                      "没有获取到任何有效节点；为避免覆盖旧配置，停止生成。"
                  )

              print(f"有效节点总数（按 server 去重）：{len(raw_nodes)}")
              nodes = rename_nodes(raw_nodes)
              node_names = [node["name"] for node in nodes]

              merged = {}
              # 先合并普通顶层配置，列表去重；特殊字段后续单独处理。
              special_keys = {
                  "proxies", "proxy-groups", "rules", "rule-providers",
                  "geodata-mode", "geo-auto-update", "geo-update-interval",
                  "geox-url"
              }

              for config in all_configs:
                  for key, value in config.items():
                      if key in special_keys:
                          continue
                      if key not in merged:
                          merged[key] = value
                      elif isinstance(merged[key], list) and isinstance(value, list):
                          merged[key] = unique(merged[key] + value)

              merged["proxies"] = nodes

              groups, fallback_target = merge_proxy_groups(all_configs, node_names)
              merged["proxy-groups"] = groups

              # 合并 rule-providers：同名时保留首次定义。
              providers = {}
              for config in all_configs:
                  for name, value in (config.get("rule-providers", {}) or {}).items():
                      providers.setdefault(name, value)
              if providers:
                  merged["rule-providers"] = providers

              # 合并原有具体分流规则，保留首次出现的顺序。
              rules = []
              for config in all_configs:
                  for rule in config.get("rules", []) or []:
                      if not isinstance(rule, str):
                          continue
                      rule_type = rule.split(",", 1)[0].strip().upper()
                      if rule_type in ("MATCH", "FINAL"):
                          continue
                      rules.append(rule)

              rules = unique(rules)

              # 原有具体规则优先；其后国内 IP/域名直连；最后未匹配流量走代理。
              cn_rules = [
                  "GEOIP,CN,DIRECT",
                  "GEOSITE,CN,DIRECT",
              ]
              rules = [rule for rule in rules if rule not in cn_rules]
              rules.extend(cn_rules)
              rules.append(f"MATCH,{fallback_target}")
              merged["rules"] = rules

              # Mihomo GeoData 配置，供 GEOIP / GEOSITE 规则使用。
              merged["geodata-mode"] = True
              merged["geo-auto-update"] = True
              merged["geo-update-interval"] = 24

              geox = merged.get("geox-url", {})
              if not isinstance(geox, dict):
                  geox = {}
              geox.setdefault("geoip", GEOIP_URL)
              geox.setdefault("geosite", GEOSITE_URL)
              merged["geox-url"] = geox

              with open(OUTPUT_FILE, "w", encoding="utf-8", newline="\n") as f:
                  yaml.safe_dump(
                      merged,
                      f,
                      allow_unicode=True,
                      sort_keys=False,
                      default_flow_style=False,
                  )

              print(f"生成完成：{OUTPUT_FILE}")
              print(f"节点数：{len(nodes)}")
              print(f"代理组数：{len(groups)}")
              print(f"规则数：{len(rules)}")
              print(f"最终兜底代理组：{fallback_target}")

          if __name__ == "__main__":
              main()
          PY

          python merge.py

      - name: Commit and push final.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final.yaml
          if git diff --cached --quiet; then
            echo "final.yaml 没有变化，无需提交。"
          else
            git commit -m "Update merged Clash configuration"
            git push
          fi
