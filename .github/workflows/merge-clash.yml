
name: Merge Clash and Mihomo Configs

on:
  schedule:
    - cron: "0 23 * * *" # 北京时间每天 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-clash-config
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML requests

      - name: Download and merge configurations
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          python <<'PY'
          import os, sys, re, time, socket, subprocess, ipaddress
          from collections import Counter
          from urllib.parse import urlparse, quote
          import requests, yaml

          INPUT = "urls.txt"
          OUTPUT = "final.yaml"
          DIRECT_GROUP = "🌐 直连优先"
          SELECT_GROUP = "🚀 节点选择"
          GEO_RULES = ["GEOIP,CN,DIRECT", "GEOSITE,CN,DIRECT"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 ClashConfigMerger/2.0",
              "Accept": "*/*"
          })
          geo_cache = {}

          def log(s):
              print(s, flush=True)

          def unique(items):
              result, seen = [], set()
              for x in items:
                  key = yaml.safe_dump(x, allow_unicode=True, sort_keys=True)
                  if key not in seen:
                      seen.add(key)
                      result.append(x)
              return result

          def merge_dict(a, b):
              out = dict(a)
              for k, v in b.items():
                  if k not in out:
                      out[k] = v
                  elif isinstance(out[k], dict) and isinstance(v, dict):
                      out[k] = merge_dict(out[k], v)
                  elif isinstance(out[k], list) and isinstance(v, list):
                      out[k] = unique(out[k] + v)
                  # 普通字段冲突时保留第一个来源
              return out

          def load_urls():
              if not os.path.isfile(INPUT):
                  raise RuntimeError("仓库根目录缺少 urls.txt")
              with open(INPUT, encoding="utf-8-sig") as f:
                  urls = [
                      line.strip() for line in f
                      if line.strip()
                      and not line.strip().startswith("#")
                      and line.strip().startswith(("http://", "https://"))
                  ]
              urls = unique(urls)
              if not urls:
                  raise RuntimeError("urls.txt 没有有效的在线地址")
              return urls

          def download(url):
              candidates = [url]
              p = urlparse(url)
              if p.netloc.lower() == "github.com":
                  parts = p.path.strip("/").split("/")
                  if len(parts) >= 5 and parts[2] == "blob":
                      candidates.append(
                          "https://raw.githubusercontent.com/"
                          + "/".join(parts[:2] + parts[3:])
                      )

              for u in unique(candidates):
                  for verify in (True, False):
                      try:
                          r = session.get(
                              u, timeout=(10, 30), allow_redirects=True,
                              verify=verify
                          )
                          if r.ok and r.content.strip():
                              return r.content.decode("utf-8-sig")
                      except Exception as e:
                          log(f"HTTP 读取失败：{str(e)[:120]}")

              for tool in ("curl", "wget"):
                  if not shutil_which(tool):
                      continue
                  for u in candidates:
                      try:
                          cmd = (
                              ["curl", "-fsSL", "--max-time", "35", u]
                              if tool == "curl"
                              else ["wget", "-q", "-T", "35", "-O", "-", u]
                          )
                          r = subprocess.run(
                              cmd, capture_output=True, timeout=45
                          )
                          if r.returncode == 0 and r.stdout.strip():
                              return r.stdout.decode("utf-8-sig")
                      except Exception as e:
                          log(f"{tool} 读取失败：{str(e)[:100]}")
              log(f"跳过下载失败的来源：{url}")
              return None

          def shutil_which(name):
              from shutil import which
              return which(name) is not None

          def parse_config(text, url):
              try:
                  docs = list(yaml.safe_load_all(text))
                  docs = [d for d in docs if isinstance(d, dict)]
                  if docs:
                      result = {}
                      for d in docs:
                          result = merge_dict(result, d)
                      return result
              except yaml.YAMLError as e:
                  log(f"YAML 解析失败：{url}：{str(e)[:150]}")

              # 兼容文件前带有说明文字的订阅
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if re.match(r"^(proxies|proxy-groups|rules|port|mixed-port|dns|mode)\s*:", line):
                      try:
                          d = yaml.safe_load("\n".join(lines[i:]))
                          if isinstance(d, dict):
                              return d
                      except yaml.YAMLError:
                          continue
              log(f"跳过无法解析的来源：{url}")
              return None

          def resolve_ip(server):
              if not isinstance(server, str) or not server.strip():
                  return None
              host = server.strip().strip("[]")
              try:
                  ip = ipaddress.ip_address(host)
                  return str(ip) if ip.is_global else None
              except ValueError:
                  pass
              if host.count(":") == 1:
                  h, p = host.rsplit(":", 1)
                  if p.isdigit():
                      host = h
              try:
                  for ans in socket.getaddrinfo(host, None, type=socket.SOCK_STREAM):
                      ip = ans[4][0].split("%")[0]
                      if ipaddress.ip_address(ip).is_global:
                          return ip
              except Exception as e:
                  log(f"DNS 解析失败 {host}: {str(e)[:100]}")
              return None

          COUNTRY_ZH = {
              "CN":"中国", "HK":"中国香港", "MO":"中国澳门", "TW":"中国台湾",
              "US":"美国", "JP":"日本", "KR":"韩国", "SG":"新加坡",
              "GB":"英国", "DE":"德国", "FR":"法国", "NL":"荷兰",
              "RU":"俄罗斯", "CA":"加拿大", "AU":"澳大利亚", "IN":"印度",
              "ID":"印度尼西亚", "MY":"马来西亚", "TH":"泰国", "VN":"越南",
              "PH":"菲律宾", "TR":"土耳其", "CH":"瑞士", "SE":"瑞典",
              "NO":"挪威", "FI":"芬兰", "DK":"丹麦", "IT":"意大利",
              "ES":"西班牙", "PT":"葡萄牙", "BE":"比利时", "AT":"奥地利",
              "PL":"波兰", "UA":"乌克兰", "BR":"巴西", "AR":"阿根廷",
              "MX":"墨西哥", "ZA":"南非", "AE":"阿联酋", "IL":"以色列",
              "IR":"伊朗", "PK":"巴基斯坦", "BD":"孟加拉国",
              "KZ":"哈萨克斯坦", "IE":"爱尔兰", "CZ":"捷克",
              "RO":"罗马尼亚", "GR":"希腊", "IS":"冰岛"
          }

          def country_of(ip):
              if not ip:
                  return "未知地区"
              if ip in geo_cache:
                  return geo_cache[ip]
              name = None
              try:
                  r = session.get(
                      f"http://ip-api.com/json/{quote(ip)}",
                      params={"fields":"status,country,countryCode", "lang":"zh-CN"},
                      timeout=10
                  )
                  d = r.json()
                  if d.get("status") == "success":
                      name = d.get("country")
              except Exception as e:
                  log(f"主 GeoIP 查询失败：{str(e)[:100]}")
              if not name:
                  try:
                      d = session.get(
                          f"https://ipwho.is/{quote(ip)}", timeout=10
                      ).json()
                      if d.get("success"):
                          name = COUNTRY_ZH.get(
                              str(d.get("country_code", "")).upper()
                          ) or d.get("country")
                  except Exception as e:
                      log(f"备用 GeoIP 查询失败：{str(e)[:100]}")
              geo_cache[ip] = name or "未知地区"
              time.sleep(0.5)
              return geo_cache[ip]

          def main():
              configs = []
              urls = load_urls()
              for i, url in enumerate(urls, 1):
                  log(f"[{i}/{len(urls)}] 读取 {url}")
                  raw = download(url)
                  if raw is None:
                      continue
                  cfg = parse_config(raw, url)
                  if cfg is not None:
                      configs.append(cfg)

              if not configs:
                  raise RuntimeError("所有来源均失败，保留原 final.yaml，不生成空配置")

              merged = {}
              proxies, rules = [], []
              groups, group_order = {}, []
              rule_providers, proxy_providers = {}, {}

              special = {
                  "proxies", "proxy-groups", "rules",
                  "rule-providers", "proxy-providers"
              }

              for cfg in configs:
                  merged = merge_dict(
                      merged, {k:v for k,v in cfg.items() if k not in special}
                  )

                  for p in cfg.get("proxies") or []:
                      if isinstance(p, dict):
                          proxies.append(dict(p))

                  for g in cfg.get("proxy-groups") or []:
                      if not isinstance(g, dict) or not g.get("name"):
                          continue
                      n = g["name"]
                      if n not in groups:
                          groups[n] = dict(g)
                          group_order.append(n)
                      else:
                          groups[n] = merge_dict(groups[n], g)

                  rules.extend(
                      r for r in (cfg.get("rules") or [])
                      if isinstance(r, (str, dict))
                  )

                  for key, target in (
                      ("rule-providers", rule_providers),
                      ("proxy-providers", proxy_providers)
                  ):
                      for n, v in (cfg.get(key) or {}).items():
                          if n not in target:
                              target[n] = v
                          elif isinstance(target[n], dict) and isinstance(v, dict):
                              target[n] = merge_dict(target[n], v)

              # 按 server 地址去重，保留首次出现的节点
              deduped, seen_servers = [], set()
              for p in proxies:
                  s = p.get("server")
                  key = s.strip().rstrip(".").lower() if isinstance(s, str) else None
                  if key and key in seen_servers:
                      log(f"重复 server，保留首个：{s}")
                      continue
                  if key:
                      seen_servers.add(key)
                  deduped.append(p)

              # GeoIP 命名；确保所有新名称唯一
              counts, used_names, old_to_new = Counter(), set(), {}
              for p in deduped:
                  old = p.get("name")
                  ip = resolve_ip(p.get("server"))
                  country = country_of(ip)
                  counts[country] += 1
                  base = country if counts[country] == 1 else f"{country}{counts[country]}"
                  name, suffix = base, 2
                  while name in used_names:
                      name = f"{base}-{suffix}"
                      suffix += 1
                  used_names.add(name)
                  p["name"] = name
                  if isinstance(old, str) and old:
                      old_to_new.setdefault(old, name)

              node_names = [p["name"] for p in deduped]
              node_set = set(node_names)

              # 修复来源策略组中的节点引用
              for n in group_order:
                  g = groups[n]
                  refs = g.get("proxies", [])
                  if not isinstance(refs, list):
                      refs = []
                  refs = [
                      old_to_new.get(x, x) if isinstance(x, str) else x
                      for x in refs
                  ]
                  # 去除指向已被去重删除的原节点的悬空引用
                  refs = [
                      x for x in refs
                      if not isinstance(x, str)
                      or x in node_set
                      or x in ("DIRECT", "REJECT", "REJECT-DROP",
                               "PASS", "COMPATIBLE", "GLOBAL")
                      or x in groups
                  ]
                  g["proxies"] = unique(refs)

              # 确保存在一个可供故障切换使用的代理选择组
              # 优先复用原有选择组；否则建立一个节点选择组
              candidates = [
                  n for n in group_order
                  if str(groups[n].get("type", "")).lower() == "select"
                  and n != DIRECT_GROUP
              ]
              if candidates:
                  fallback_target = candidates[0]
                  groups[fallback_target]["proxies"] = unique(
                      groups[fallback_target].get("proxies", []) + node_names
                  )
              else:
                  fallback_target = SELECT_GROUP
                  if fallback_target in groups:
                      fallback_target = "🚀 节点选择（自动）"
                  groups[fallback_target] = {
                      "name": fallback_target,
                      "type": "select",
                      "proxies": node_names + ["DIRECT"]
                  }
                  group_order.append(fallback_target)

              # 自动建立直连优先组：DIRECT 健康检查失败时转向代理选择组
              groups[DIRECT_GROUP] = {
                  "name": DIRECT_GROUP,
                  "type": "fallback",
                  "proxies": ["DIRECT", fallback_target],
                  "url": "https://www.gstatic.com/generate_204",
                  "interval": 300,
                  "timeout": 5000
              }
              if DIRECT_GROUP not in group_order:
                  group_order.append(DIRECT_GROUP)

              # 将原规则中的最终兜底规则移到末尾并替换目标。
              # 其他具体规则的顺序尽量保留。
              final_rules = []
              for r in rules:
                  if isinstance(r, str):
                      parts = r.split(",", 1)
                      if parts[0].strip().upper() in ("MATCH", "FINAL"):
                          continue
                  final_rules.append(r)

              final_rules = unique(final_rules)

              # 国内规则放在具体规则后、兜底之前。
              # 因此原有的指定网站/应用分流规则仍优先生效。
              final_rules = [
                  r for r in final_rules if r not in GEO_RULES
              ] + GEO_RULES
              final_rules.append(f"MATCH,{DIRECT_GROUP}")

              merged["proxies"] = deduped
              merged["proxy-groups"] = [groups[n] for n in group_order]
              merged["rules"] = final_rules

              if rule_providers:
                  merged["rule-providers"] = rule_providers
              if proxy_providers:
                  merged["proxy-providers"] = proxy_providers

              # GeoData 自动更新配置；保留来源中已设置的自定义地址
              merged.setdefault("geodata-mode", True)
              merged.setdefault("geo-auto-update", True)
              merged.setdefault("geo-update-interval", 24)
              geox = merged.setdefault("geox-url", {})
              if isinstance(geox, dict):
                  geox.setdefault(
                      "geoip",
                      "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
                  )
                  geox.setdefault(
                      "geosite",
                      "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
                  )
                  geox.setdefault(
                      "mmdb",
                      "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
                  )

              text = yaml.safe_dump(
                  merged, allow_unicode=True, sort_keys=False,
                  default_flow_style=False, width=120
              )
              check = yaml.safe_load(text)
              if not isinstance(check, dict):
                  raise RuntimeError("最终 YAML 校验失败")
              if not isinstance(check.get("proxies"), list):
                  raise RuntimeError("最终配置缺少 proxies")
              if not isinstance(check.get("proxy-groups"), list):
                  raise RuntimeError("最终配置缺少 proxy-groups")
              if not isinstance(check.get("rules"), list):
                  raise RuntimeError("最终配置缺少 rules")

              with open(OUTPUT, "w", encoding="utf-8", newline="\n") as f:
                  f.write(text)
              log(
                  f"完成：来源 {len(configs)} 份，节点 {len(deduped)} 个，"
                  f"策略组 {len(group_order)} 个，规则 {len(final_rules)} 条"
              )

          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  log(f"工作流失败：{e}")
                  sys.exit(1)
          PY

      - name: Commit and push final.yaml
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final.yaml
          if git diff --cached --quiet; then
            echo "final.yaml 无变化"
            exit 0
          fi
          git commit -m "chore: update merged Clash configuration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
