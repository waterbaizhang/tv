```yaml
name: Merge Clash Subscriptions

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: merge-clash-subscriptions
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML requests

      - name: Merge subscriptions
        env:
          PYTHONUTF8: "1"
        run: |
          cat > merge.py <<'PY'
          import os
          import re
          import time
          import socket
          import ipaddress
          import subprocess

          import requests
          import yaml

          URLS_FILE = "urls.txt"
          OUTPUT_FILE = "final.yaml"

          SELECT_GROUP = "🚀 节点选择"

          GEOIP_URL = (
              "https://github.com/MetaCubeX/meta-rules-dat/"
              "releases/latest/download/geoip.dat"
          )
          GEOSITE_URL = (
              "https://github.com/MetaCubeX/meta-rules-dat/"
              "releases/latest/download/geosite.dat"
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 ClashSubscriptionMerger/1.0"
          })

          COUNTRY_NAMES = {
              "China": "中国",
              "Hong Kong": "香港",
              "Macao": "澳门",
              "Taiwan": "台湾",
              "Japan": "日本",
              "South Korea": "韩国",
              "Korea": "韩国",
              "Singapore": "新加坡",
              "United States": "美国",
              "United Kingdom": "英国",
              "Canada": "加拿大",
              "Australia": "澳大利亚",
              "New Zealand": "新西兰",
              "Germany": "德国",
              "France": "法国",
              "Netherlands": "荷兰",
              "Russia": "俄罗斯",
              "India": "印度",
              "Indonesia": "印度尼西亚",
              "Malaysia": "马来西亚",
              "Thailand": "泰国",
              "Vietnam": "越南",
              "Philippines": "菲律宾",
              "Turkey": "土耳其",
              "Switzerland": "瑞士",
              "Sweden": "瑞典",
              "Norway": "挪威",
              "Finland": "芬兰",
              "Italy": "意大利",
              "Spain": "西班牙",
              "Poland": "波兰",
              "Ukraine": "乌克兰",
              "Brazil": "巴西",
              "Argentina": "阿根廷",
              "Mexico": "墨西哥",
              "United Arab Emirates": "阿联酋",
              "Israel": "以色列",
              "South Africa": "南非",
              "Romania": "罗马尼亚",
              "Bulgaria": "保加利亚",
              "Czechia": "捷克",
              "Austria": "奥地利",
              "Belgium": "比利时",
              "Ireland": "爱尔兰",
              "Portugal": "葡萄牙",
              "Denmark": "丹麦",
              "Iceland": "冰岛",
              "Luxembourg": "卢森堡",
              "Estonia": "爱沙尼亚",
              "Latvia": "拉脱维亚",
              "Lithuania": "立陶宛",
              "Cyprus": "塞浦路斯",
              "Greece": "希腊",
              "Hungary": "匈牙利",
              "Slovakia": "斯洛伐克",
              "Slovenia": "斯洛文尼亚",
              "Croatia": "克罗地亚",
              "Serbia": "塞尔维亚",
              "Georgia": "格鲁吉亚",
              "Kazakhstan": "哈萨克斯坦",
              "Pakistan": "巴基斯坦",
              "Bangladesh": "孟加拉国",
              "Nepal": "尼泊尔",
              "Cambodia": "柬埔寨",
              "Laos": "老挝",
              "Myanmar": "缅甸",
              "Mongolia": "蒙古",
              "Chile": "智利",
              "Colombia": "哥伦比亚",
              "Peru": "秘鲁",
              "Panama": "巴拿马",
              "Costa Rica": "哥斯达黎加",
              "Nigeria": "尼日利亚",
              "Egypt": "埃及",
              "Saudi Arabia": "沙特阿拉伯",
              "Qatar": "卡塔尔",
              "Kuwait": "科威特",
              "Bahrain": "巴林",
              "Oman": "阿曼",
              "Jordan": "约旦",
              "Iraq": "伊拉克",
              "Iran": "伊朗",
              "Afghanistan": "阿富汗",
          }

          geo_cache = {}

          def unique(items):
              result = []
              seen = set()

              for item in items:
                  try:
                      if isinstance(item, (dict, list)):
                          key = yaml.safe_dump(
                              item,
                              allow_unicode=True,
                              sort_keys=True
                          )
                      else:
                          key = str(item)
                  except Exception:
                      key = str(item)

                  if key not in seen:
                      seen.add(key)
                      result.append(item)

              return result

          def fetch_text(url):
              """下载失败时重试，并尝试 curl；失败来源由调用方跳过。"""
              for attempt in range(3):
                  try:
                      response = session.get(
                          url,
                          timeout=(10, 30),
                          allow_redirects=True
                      )
                      response.raise_for_status()

                      content = response.text.lstrip("\ufeff")
                      if content.strip():
                          return content

                  except Exception as exc:
                      print(
                          f"  requests 第 {attempt + 1} 次下载失败：{exc}"
                      )
                      time.sleep(attempt + 1)

              try:
                  result = subprocess.run(
                      [
                          "curl", "-fLsS",
                          "--retry", "2",
                          "--connect-timeout", "10",
                          "--max-time", "40",
                          url
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                      encoding="utf-8"
                  )

                  if result.stdout.strip():
                      return result.stdout.lstrip("\ufeff")

              except Exception as exc:
                  print(f"  curl 下载失败：{exc}")

              return None

          def load_subscription(url):
              content = fetch_text(url)

              if not content:
                  return None

              try:
                  data = yaml.safe_load(content)

                  if isinstance(data, dict):
                      return data

              except Exception as exc:
                  print(f"  YAML 解析失败：{exc}")

              print("  订阅内容不是有效的 YAML 配置，跳过。")
              return None

          def resolve_host(server):
              server = str(server or "").strip().strip("[]")

              if not server:
                  return None

              try:
                  return str(ipaddress.ip_address(server))
              except ValueError:
                  pass

              try:
                  return socket.gethostbyname(server)
              except Exception:
                  return None

          def country_of_server(server):
              ip = resolve_host(server)

              if not ip:
                  return "未知地区"

              if ip in geo_cache:
                  return geo_cache[ip]

              country = "未知地区"

              try:
                  response = session.get(
                      f"http://ip-api.com/json/{ip}",
                      params={"fields": "status,country"},
                      timeout=8
                  )
                  data = response.json()

                  if data.get("status") == "success":
                      country = COUNTRY_NAMES.get(
                          data.get("country", ""),
                          data.get("country", "未知地区")
                      )

              except Exception as exc:
                  print(f"  GeoIP 查询失败 {ip}：{exc}")

              geo_cache[ip] = country
              return country

          def rename_nodes(raw_nodes):
              """按 server 所在国家命名，重名时递增编号。"""
              counts = {}
              nodes = []
              server_to_new_name = {}

              for original in raw_nodes:
                  node = dict(original)
                  server_key = str(node.get("server", "")).strip().lower()

                  country = country_of_server(node.get("server"))
                  counts[country] = counts.get(country, 0) + 1

                  if counts[country] == 1:
                      new_name = country
                  else:
                      new_name = f"{country} {counts[country]}"

                  node["name"] = new_name
                  nodes.append(node)
                  server_to_new_name[server_key] = new_name

              return nodes, server_to_new_name

          def merge_proxy_providers(configs):
              """合并代理提供者，保留同名项的首次定义。"""
              providers = {}

              for config in configs:
                  source = config.get("proxy-providers", {}) or {}

                  if not isinstance(source, dict):
                      continue

                  for name, value in source.items():
                      if name not in providers and isinstance(value, dict):
                          providers[name] = value

              return providers

          def merge_proxy_groups(configs, node_names, name_map, providers):
              groups = {}
              group_order = []

              # 合并同名代理组。
              for config in configs:
                  source = config.get("proxy-groups", []) or []

                  if not isinstance(source, list):
                      continue

                  for item in source:
                      if not isinstance(item, dict) or not item.get("name"):
                          continue

                      name = str(item["name"])

                      if name not in groups:
                          groups[name] = dict(item)
                          groups[name]["proxies"] = list(
                              item.get("proxies", []) or []
                          )
                          groups[name]["use"] = list(
                              item.get("use", []) or []
                          )
                          group_order.append(name)

                      else:
                          current = groups[name]

                          for key, value in item.items():
                              if key == "proxies":
                                  current.setdefault("proxies", [])
                                  current["proxies"].extend(value or [])

                              elif key == "use":
                                  current.setdefault("use", [])
                                  current["use"].extend(value or [])

                              elif key not in current:
                                  current[key] = value

              # 原订阅节点名称改成国家名称后，同步更新组内引用。
              for group in groups.values():
                  refs = group.get("proxies", []) or []
                  mapped_refs = []

                  for ref in refs:
                      if not isinstance(ref, str):
                          continue

                      mapped_refs.append(name_map.get(ref, ref))

                  group["proxies"] = unique(mapped_refs)

                  uses = group.get("use", []) or []
                  group["use"] = unique([
                      ref for ref in uses
                      if isinstance(ref, str) and ref in providers
                  ])

              # 只保留有效的节点、组和内置策略引用。
              builtins = {"DIRECT", "REJECT", "PASS", "COMPATIBLE"}

              for group_name, group in list(groups.items()):
                  refs = group.get("proxies", []) or []

                  valid_refs = unique([
                      ref for ref in refs
                      if isinstance(ref, str)
                      and ref != group_name
                      and (
                          ref in set(node_names)
                          or ref in groups
                          or ref in builtins
                      )
                  ])

                  group["proxies"] = valid_refs

                  uses = group.get("use", []) or []
                  group["use"] = unique([
                      ref for ref in uses
                      if isinstance(ref, str) and ref in providers
                  ])

                  group_type = str(group.get("type", "")).lower()

                  # 这些类型必须至少有一个有效节点或 provider。
                  requires_source = group_type in (
                      "select",
                      "url-test",
                      "fallback",
                      "load-balance",
                      "relay"
                  )

                  if requires_source and not group["proxies"] and not group["use"]:
                      if node_names:
                          group["proxies"] = list(node_names)
                          print(
                              f"修复空代理组：{group_name}，"
                              f"补入 {len(node_names)} 个节点"
                          )
                      else:
                          print(f"删除空代理组：{group_name}")
                          del groups[group_name]
                          if group_name in group_order:
                              group_order.remove(group_name)

              # 移除指向已删除代理组的引用；必要时再次补充节点。
              existing_groups = set(groups)

              for group_name, group in list(groups.items()):
                  group["proxies"] = unique([
                      ref for ref in (group.get("proxies", []) or [])
                      if ref in set(node_names)
                      or ref in existing_groups
                      or ref in builtins
                  ])

                  group["use"] = unique([
                      ref for ref in (group.get("use", []) or [])
                      if ref in providers
                  ])

                  group_type = str(group.get("type", "")).lower()

                  if (
                      group_type in (
                          "select", "url-test", "fallback",
                          "load-balance", "relay"
                      )
                      and not group["proxies"]
                      and not group["use"]
                  ):
                      if node_names:
                          group["proxies"] = list(node_names)
                      else:
                          del groups[group_name]
                          if group_name in group_order:
                              group_order.remove(group_name)

              # 选择一个已有 select 组作为最终代理出口。
              candidates = [
                  name for name in group_order
                  if name in groups
                  and str(groups[name].get("type", "")).lower() == "select"
              ]

              if candidates:
                  fallback_target = candidates[0]
                  groups[fallback_target]["proxies"] = unique(
                      list(groups[fallback_target].get("proxies", []) or [])
                      + list(node_names)
                  )
              else:
                  fallback_target = SELECT_GROUP

                  if fallback_target in groups:
                      fallback_target = "🚀 节点选择（自动）"

                  groups[fallback_target] = {
                      "name": fallback_target,
                      "type": "select",
                      "proxies": list(node_names) + ["DIRECT"]
                  }
                  group_order.append(fallback_target)

              # 生成按国家划分的节点组。
              country_members = {}

              for node_name in node_names:
                  country = re.sub(r"\s+\d+$", "", node_name)
                  country_members.setdefault(country, []).append(node_name)

              country_group_refs = []

              for country, members in country_members.items():
                  group_name = f"{country}节点"

                  if group_name in groups:
                      group = groups[group_name]
                      group["proxies"] = unique(
                          list(group.get("proxies", []) or []) + members
                      )

                  else:
                      groups[group_name] = {
                          "name": group_name,
                          "type": "select",
                          "proxies": list(members)
                      }
                      group_order.append(group_name)

                  country_group_refs.append(group_name)

              # 将国家组加入总选择组。
              groups[fallback_target]["proxies"] = unique(
                  list(groups[fallback_target].get("proxies", []) or [])
                  + country_group_refs
              )

              # 最终再次校验，防止输出空代理组。
              existing_groups = set(groups)

              for group_name, group in list(groups.items()):
                  group["proxies"] = unique([
                      ref for ref in (group.get("proxies", []) or [])
                      if ref in set(node_names)
                      or ref in existing_groups
                      or ref in builtins
                  ])

                  group["use"] = unique([
                      ref for ref in (group.get("use", []) or [])
                      if ref in providers
                  ])

                  group_type = str(group.get("type", "")).lower()

                  if (
                      group_type in (
                          "select", "url-test", "fallback",
                          "load-balance", "relay"
                      )
                      and not group["proxies"]
                      and not group["use"]
                  ):
                      if node_names:
                          group["proxies"] = list(node_names)
                      else:
                          raise RuntimeError(
                              f"代理组 {group_name} 没有有效节点来源"
                          )

              return [
                  groups[name] for name in group_order if name in groups
              ], fallback_target

          def main():
              if not os.path.isfile(URLS_FILE):
                  raise SystemExit(
                      "找不到根目录 urls.txt，请先创建该文件。"
                  )

              with open(URLS_FILE, "r", encoding="utf-8-sig") as f:
                  urls = [
                      line.strip()
                      for line in f
                      if line.strip() and not line.strip().startswith("#")
                  ]

              if not urls:
                  raise SystemExit("urls.txt 中没有可用订阅链接。")

              configs = []
              raw_nodes = []
              seen_servers = set()
              server_to_original_name = {}
              original_name_to_server = {}

              for index, url in enumerate(urls, 1):
                  print(f"[{index}/{len(urls)}] 下载订阅：{url}")

                  config = load_subscription(url)

                  if not config:
                      print("  来源不可用，跳过。")
                      continue

                  configs.append(config)
                  source_nodes = config.get("proxies", []) or []
                  accepted = 0

                  if not isinstance(source_nodes, list):
                      print("  proxies 字段不是列表，跳过该来源的节点。")
                      continue

                  for node in source_nodes:
                      if not isinstance(node, dict) or not node.get("server"):
                          continue

                      server_key = str(node["server"]).strip().lower()
                      original_name = node.get("name")

                      if server_key not in seen_servers:
                          seen_servers.add(server_key)
                          raw_nodes.append(dict(node))
                          server_to_original_name[server_key] = original_name
                          accepted += 1

                      # 重复 server 也映射到第一个保留的节点。
                      if original_name and server_key:
                          original_name_to_server.setdefault(
                              str(original_name), server_key
                          )

                  print(f"  新收录节点：{accepted}")

              if not raw_nodes:
                  raise SystemExit(
                      "没有获取到有效节点。为避免覆盖旧配置，停止生成。"
                  )

              print(f"去重后节点数：{len(raw_nodes)}")

              nodes, server_to_new_name = rename_nodes(raw_nodes)
              node_names = [node["name"] for node in nodes]

              # 原节点名称 -> 新节点名称，供代理组引用更新。
              name_map = {}

              for original_name, server_key in original_name_to_server.items():
                  new_name = server_to_new_name.get(server_key)

                  if new_name:
                      name_map[original_name] = new_name

              merged = {}

              special_keys = {
                  "proxies",
                  "proxy-groups",
                  "proxy-providers",
                  "rules",
                  "rule-providers",
                  "geodata-mode",
                  "geo-auto-update",
                  "geo-update-interval",
                  "geox-url"
              }

              # 合并普通顶层字段，列表按顺序去重。
              for config in configs:
                  for key, value in config.items():
                      if key in special_keys:
                          continue

                      if key not in merged:
                          merged[key] = value

                      elif (
                          isinstance(merged[key], list)
                          and isinstance(value, list)
                      ):
                          merged[key] = unique(merged[key] + value)

              merged["proxies"] = nodes

              providers = merge_proxy_providers(configs)

              if providers:
                  merged["proxy-providers"] = providers

              groups, fallback_target = merge_proxy_groups(
                  configs,
                  node_names,
                  name_map,
                  providers
              )
              merged["proxy-groups"] = groups

              # 合并 rule-providers，同名保留首次定义。
              rule_providers = {}

              for config in configs:
                  source = config.get("rule-providers", {}) or {}

                  if not isinstance(source, dict):
                      continue

                  for name, value in source.items():
                      rule_providers.setdefault(name, value)

              if rule_providers:
                  merged["rule-providers"] = rule_providers

              # 合并原有具体规则；删除旧 MATCH / FINAL，统一添加最终兜底。
              rules = []

              for config in configs:
                  source_rules = config.get("rules", []) or []

                  if not isinstance(source_rules, list):
                      continue

                  for rule in source_rules:
                      if not isinstance(rule, str):
                          continue

                      rule_type = rule.split(",", 1)[0].strip().upper()

                      if rule_type in ("MATCH", "FINAL"):
                          continue

                      # 若规则直接引用节点名称，同步更新节点名。
                      parts = rule.split(",")

                      if len(parts) >= 3:
                          target = parts[-1].strip()

                          if target in name_map:
                              parts[-1] = name_map[target]
                              rule = ",".join(parts)

                      rules.append(rule)

              rules = unique(rules)

              # 保留原有具体规则优先级。
              # 国内 IP / 域名直连；其他未匹配流量最终走代理。
              cn_rules = [
                  "GEOIP,CN,DIRECT",
                  "GEOSITE,CN,DIRECT"
              ]

              rules = [rule for rule in rules if rule not in cn_rules]
              rules.extend(cn_rules)
              rules.append(f"MATCH,{fallback_target}")

              merged["rules"] = rules

              # Mihomo GeoData 设置。
              merged["geodata-mode"] = True
              merged["geo-auto-update"] = True
              merged["geo-update-interval"] = 24

              geox = merged.get("geox-url", {})

              if not isinstance(geox, dict):
                  geox = {}

              geox.setdefault("geoip", GEOIP_URL)
              geox.setdefault("geosite", GEOSITE_URL)
              merged["geox-url"] = geox

              # 输出前检查组引用，避免生成空代理组。
              all_node_names = set(node_names)
              all_group_names = {
                  group.get("name")
                  for group in groups
                  if isinstance(group, dict)
              }
              all_builtins = {
                  "DIRECT", "REJECT", "PASS", "COMPATIBLE"
              }

              for group in groups:
                  group_name = group.get("name", "<unnamed>")
                  group_type = str(group.get("type", "")).lower()
                  refs = group.get("proxies", []) or []
                  uses = group.get("use", []) or []

                  if group_type in (
                      "select", "url-test", "fallback",
                      "load-balance", "relay"
                  ) and not refs and not uses:
                      raise RuntimeError(
                          f"配置检查失败：代理组 {group_name} "
                          "没有 proxies 或 use。"
                      )

                  for ref in refs:
                      if (
                          ref not in all_node_names
                          and ref not in all_group_names
                          and ref not in all_builtins
                      ):
                          raise RuntimeError(
                              f"配置检查失败：代理组 {group_name} "
                              f"引用了不存在的节点或代理组：{ref}"
                          )

                  for provider in uses:
                      if provider not in providers:
                          raise RuntimeError(
                              f"配置检查失败：代理组 {group_name} "
                              f"引用了不存在的 proxy-provider：{provider}"
                          )

              with open(
                  OUTPUT_FILE, "w", encoding="utf-8", newline="\n"
              ) as f:
                  yaml.safe_dump(
                      merged,
                      f,
                      allow_unicode=True,
                      sort_keys=False,
                      default_flow_style=False
                  )

              # 再次读取，确认输出文件可被 YAML 解析。
              with open(OUTPUT_FILE, "r", encoding="utf-8") as f:
                  check = yaml.safe_load(f)

              if not isinstance(check, dict):
                  raise RuntimeError("生成后的 final.yaml 不是有效配置对象。")

              print("配置生成并通过基础检查。")
              print(f"输出文件：{OUTPUT_FILE}")
              print(f"节点数量：{len(nodes)}")
              print(f"代理组数量：{len(groups)}")
              print(f"规则数量：{len(rules)}")
              print(f"最终兜底代理组：{fallback_target}")

          if __name__ == "__main__":
              main()
          PY

          python merge.py

      - name: Commit and push final.yaml
        run: |
          git config user.name "github-actions[bot]"
