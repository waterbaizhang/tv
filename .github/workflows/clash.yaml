name: Merge Clash Nodes

on:
  schedule:
    # 每天北京时间 7:00 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送代码
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml geoip2 dnspython

      - name: Run merge script
        env:
          # 可选：如果需要代理下载 GeoIP 数据库，可以设置，但通常不需要
          # HTTP_PROXY: http://proxy.example.com:8080
          # HTTPS_PROXY: http://proxy.example.com:8080
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import sys
          import gzip
          import shutil
          import socket
          import requests
          import yaml
          import geoip2.database
          from urllib.parse import urlparse
          from collections import OrderedDict

          # 国家代码到中文名的映射（可自行扩展）
          COUNTRY_NAMES = {
              'AD': '安道尔', 'AE': '阿联酋', 'AF': '阿富汗', 'AG': '安提瓜和巴布达', 'AI': '安圭拉',
              'AL': '阿尔巴尼亚', 'AM': '亚美尼亚', 'AO': '安哥拉', 'AQ': '南极洲', 'AR': '阿根廷',
              'AS': '美属萨摩亚', 'AT': '奥地利', 'AU': '澳大利亚', 'AW': '阿鲁巴', 'AX': '奥兰群岛',
              'AZ': '阿塞拜疆', 'BA': '波黑', 'BB': '巴巴多斯', 'BD': '孟加拉国', 'BE': '比利时',
              'BF': '布基纳法索', 'BG': '保加利亚', 'BH': '巴林', 'BI': '布隆迪', 'BJ': '贝宁',
