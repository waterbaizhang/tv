name: Build Clash Config

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Python YAML module
        run: pip install pyyaml requests

      - name: Build merged final.yaml
        run: |
          cat > merge.py << 'EOF'
          import yaml, requests, collections

          urls = [
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/1/config.yaml",
              "https://fastly.jsdelivr.net/gh/Alvin9999/PAC@latest/backup/img/1/2/ipp/clash.meta2/2/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/3/config.yaml",
              "https://fastly.jsdelivr.net/gh/Alvin9999/PAC@latest/backup/img/1/2/ipp/clash.meta2/4/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/5/config.yaml",
              "https://fastly.jsdelivr.net/gh/Alvin9999/PAC@latest/backup/img/1/2/ipp/clash.meta2/6/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/clash.meta2/1/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/clash.meta2/2/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/clash.meta2/3/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/clash.meta2/4/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/clash.meta2/5/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/clash.meta2/6/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/quick/1/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/quick/2/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/quick/3/config.yaml",
              "https://www.gitlabip.xyz/Alvin9999/PAC/refs/heads/master/backup/img/1/2/ipp/quick/4/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/1/config.yaml",
              "https://fastly.jsdelivr.net/gh/Alvin9999/PAC@latest/backup/img/1/2/ipp/quick/2/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/3/config.yaml",
              "https://fastly.jsdelivr.net/gh/Alvin9999/PAC@latest/backup/img/1/2/ipp/quick/4/config.yaml",
          ]

          merged = {"proxies": [], "proxy-groups": [], "rules": []}

          def rename_if_exists(items, name):
              base = name
              i = 1
              while any(x["name"] == name for x in items):
                  name = f"{base}-{i}"
                  i += 1
              return name

          def safe_request(url):
              try:
                  r = requests.get(url, timeout=10)
                  if r.status_code == 200:
                      return r.text
              except:
                  return None
              return None

          print("Downloading and merging files...")
          for url in urls:
              text = safe_request(url)
              if not text:
                  print("❌ Skip invalid URL:", url)
                  continue
              try:
                  data = yaml.safe_load(text)
                  if not isinstance(data, dict):
                      print("❌ Invalid YAML:", url)
                      continue
              except:
                  print("❌ Failed to parse YAML:", url)
                  continue

              # Merge proxies
              if "proxies" in data:
                  for p in data["proxies"]:
                      p_copy = p.copy()
                      p_copy["name"] = rename_if_exists(merged["proxies"], p_copy["name"])
                      merged["proxies"].append(p_copy)

              # Merge proxy-groups
              if "proxy-groups" in data:
                  for g in data["proxy-groups"]:
                      g_copy = g.copy()
                      if any(x["name"] == g_copy["name"] for x in merged["proxy-groups"]):
                          count = sum(1 for x in merged["proxy-groups"] if x["name"].startswith(g_copy["name"]))
                          g_copy["name"] = f"{g_copy['name']}-{count}"
                      merged["proxy-groups"].append(g_copy)

              # Merge rules
              if "rules" in data:
                  merged["rules"].extend(data["rules"])

          # 去除重复 rules
          merged["rules"] = list(collections.OrderedDict.fromkeys(merged["rules"]))

          # --- 自动生成 tag/region 分组 ---
          tag_groups = {}  # key=tag/region, value=list of node names
          for p in merged["proxies"]:
              tags = []
              if "tag" in p:
                  tags.append(p["tag"])
              if "region" in p:
                  tags.append(p["region"])
              for t in tags:
                  if t not in tag_groups:
                      tag_groups[t] = []
                  tag_groups[t].append(p["name"])

          # 生成分组，只生成一次节点列表
          for t, nodes in tag_groups.items():
              merged["proxy-groups"].append({
                  "name": t,
                  "type": "select",
                  "proxies": nodes  # 一次性列表
              })

          # 注入所有节点到 URL-TEST / SELECT / FALLBACK / LOAD-BALANCE 分组
          proxy_names = [p["name"] for p in merged["proxies"]]
          for g in merged["proxy-groups"]:
              if g.get("type", "").upper() in ["SELECT", "URL-TEST", "FALLBACK", "LOAD-BALANCE"]:
                  # 如果不是标签/地区分组，直接覆盖一次节点列表
                  if g["name"] not in tag_groups:
                      g["proxies"] = proxy_names

          # 输出 final.yaml
          with open("final.yaml", "w", encoding="utf-8") as f:
              yaml.dump(merged, f, allow_unicode=True, sort_keys=False)

          print("✔ final.yaml generated (each group has one proxies list)")
          EOF

      - name: Run merge script
        run: python3 merge.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add final.yaml
          git commit -m "Auto update final.yaml (single proxies list per group)" || echo "No changes"
          git push
