name: Build Clash Config

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点执行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Python YAML module
        run: pip install pyyaml requests

      - name: Merge Clash Configs
        run: |
          cat > merge.py << 'EOF'
          import yaml, requests, collections

          # 读取 urls.txt 文件
          urls = []
          try:
              with open("urls.txt", "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          urls.append(line)
          except FileNotFoundError:
              print("❌ urls.txt not found!")
              exit(1)

          merged_proxies = []
          merged_rules = []
          merged_groups = {}
          base_config = {}  # 保存第一个 YAML 的全局设置

          def rename_if_exists(items, name):
              base = name
              i = 1
              while any(x["name"] == name for x in items):
                  name = f"{base}-{i}"
                  i += 1
              return name

          def safe_request(url):
              try:
                  r = requests.get(url, timeout=10)
                  if r.status_code == 200:
                      return r.text
              except:
                  return None
              return None

          print("Downloading and merging configurations...")
          for url in urls:
              text = safe_request(url)
              if not text:
                  print("❌ Skip invalid URL:", url)
                  continue
              try:
                  data = yaml.safe_load(text)
                  if not isinstance(data, dict):
                      print("❌ Invalid YAML:", url)
                      continue
              except:
                  print("❌ Failed to parse YAML:", url)
                  continue

              # 保存第一个 YAML 的全局配置（去掉 proxies、proxy-groups、rules）
              if not base_config:
                  base_config = {k: v for k, v in data.items() if k not in ["proxies", "proxy-groups", "rules"]}

              # 合并 proxies
              if "proxies" in data:
                  for p in data["proxies"]:
                      p_copy = p.copy()
                      p_copy["name"] = rename_if_exists(merged_proxies, p_copy["name"])
                      merged_proxies.append(p_copy)

              # 合并 rules
              if "rules" in data:
                  merged_rules.extend(data["rules"])

              # 合并 proxy-groups
              if "proxy-groups" in data:
                  for g in data["proxy-groups"]:
                      g_name = g.get("name")
                      if g_name not in merged_groups:
                          merged_groups[g_name] = g.copy()

          # 去重 rules
          dedup_rules = list(collections.OrderedDict.fromkeys(merged_rules))

          # 注入最新节点到 proxy-groups
          proxy_names = [p["name"] for p in merged_proxies]
          for g_name, g in merged_groups.items():
              g_type = g.get("type", "").upper()
              if g_type in ["SELECT", "URL-TEST", "FALLBACK", "LOAD-BALANCE"]:
                  g["proxies"] = proxy_names

          # 生成最终配置
          final = base_config.copy()
          final["proxies"] = merged_proxies
          final["proxy-groups"] = list(merged_groups.values())
          final["rules"] = dedup_rules

          with open("final.yaml", "w", encoding="utf-8") as f:
              yaml.dump(final, f, allow_unicode=True, sort_keys=False)

          print("✔ final.yaml generated with full global settings preserved")
          EOF

      - name: Run merge script
        run: python3 merge.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add final.yaml
          git commit -m "Auto update final.yaml (merged proxies, rules, proxy-groups, global settings)" || echo "No changes"
          git push
