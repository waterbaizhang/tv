name: Clash Airport Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *' # Runs at UTC 23:00, which is 07:00 Beijing time

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests geoip2

      - name: Build Airport Subscription and Rules
        run: |
          python << 'EOF'
import yaml, requests, base64, socket
from concurrent.futures import ThreadPoolExecutor, as_completed
import geoip2.database

URL_FILE = "urls.txt"
MMDB = "GeoLite2-City.mmdb"

reader = geoip2.database.Reader(MMDB)

# ===== GeoIP =====
def get_country(ip):
    try:
        r = reader.city(ip)
        return r.country.names.get("zh-CN") or r.country.name or "未知"
    except:
        return "未知"

def resolve_ip(host):
    try:
        return socket.gethostbyname(host)
    except:
        return host

# ===== Fetch data =====
def fetch(url):
    try:
        r = requests.get(url, timeout=10)
        txt = r.text.strip()

        try:
            d = base64.b64decode(txt).decode()
            if "proxies:" in d:
                txt = d
        except:
            pass

        return yaml.safe_load(txt)
    except:
        print("Skipping:", url)
        return None

# ===== Load URLs =====
with open(URL_FILE, encoding="utf-8") as f:
    urls = [x.strip() for x in f if x.strip()]

datas = []
with ThreadPoolExecutor(max_workers=10) as ex:
    futures = [ex.submit(fetch, u) for u in urls]
    for f in as_completed(futures):
        r = f.result()
        if r:
            datas.append(r)

# ===== Merge Proxies =====
seen = set()
proxies = []
country_count = {}

for data in datas:
    for p in data.get("proxies", []):
        s = p.get("server")
        if not s or s in seen:
            continue

        seen.add(s)

        ip = resolve_ip(s)
        country = get_country(ip)

        idx = country_count.get(country, 0) + 1
        country_count[country] = idx

        p["name"] = f"{country}{idx}"
        proxies.append(p)

# ===== Proxy Groups =====
all_names = [p["name"] for p in proxies]

groups = [
    {
        "name": "🚀 节点选择",
        "type": "select",
        "proxies": ["⚡ 自动选择", "🌍 全球直连"] + all_names
    },
    {
        "name": "⚡ 自动选择",
        "type": "url-test",
        "url": "http://www.gstatic.com/generate_204",
        "interval": 300,
        "proxies": all_names
    },
    {
        "name": "🌍 全球直连",
        "type": "select",
        "proxies": ["DIRECT"]
    }
]

# ===== Rule Providers =====
rule_providers = {
    "cn": {
        "type": "http",
        "behavior": "domain",
        "url": "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cn.txt",
        "path": "./ruleset/cn.yaml",
        "interval": 86400
    },
    "proxy": {
        "type": "http",
        "behavior": "domain",
        "url": "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt",
        "path": "./ruleset/proxy.yaml",
        "interval": 86400
    },
    "direct": {
        "type": "http",
        "behavior": "domain",
        "url": "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt",
        "path": "./ruleset/direct.yaml",
        "interval": 86400
    }
}

rules = [
    "RULE-SET,cn,🌍 全球直连",
    "RULE-SET,direct,🌍 全球直连",
    "RULE-SET,proxy,🚀 节点选择",
    "MATCH,🚀 节点选择"
]

# ===== Final Config =====
base_config = {
    "mixed-port": 7890,
    "mode": "rule",
    "log-level": "info",
    "proxies": proxies,
    "proxy-groups": groups,
    "rule-providers": rule_providers,
    "rules": rules
}

# ===== Output Files =====
def save(name, data):
    with open(name, "w", encoding="utf-8") as f:
        yaml.dump(data, f, allow_unicode=True, sort_keys=False)

# Full config
save("sub.yaml", base_config)

# Global Proxy config
global_cfg = base_config.copy()
global_cfg["rules"] = ["MATCH,🚀 节点选择"]
save("sub_global.yaml", global_cfg)

# CN Optimization config
cn_cfg = base_config.copy()
cn_cfg["rules"] = [
    "RULE-SET,cn,🌍 全球直连",
    "MATCH,🚀 节点选择"
]
save("sub_cn.yaml", cn_cfg)

# Game Optimization config
game_cfg = base_config.copy()
game_cfg["proxy-groups"][0]["proxies"] = ["⚡ 自动选择"]
save("sub_game.yaml", game_cfg)

# Base64 Subscription
with open("sub.yaml", encoding="utf-8") as f:
    b64 = base64.b64encode(f.read().encode()).decode()

with open("sub.txt", "w") as f:
    f.write(b64)

print("✅ 规则 + 分流订阅生成完成")
EOF

      - name: Commit changes
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Update airport subscription and rules" || echo "No changes"
          git push
