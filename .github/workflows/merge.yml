name: Build Clash Config

on:
  schedule:
    - cron: "0 23 * * *"  # 每天 UTC 23 点执行，相当于北京时间早7点
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3  

      - name: Install Python and Dependencies
        run: |
          sudo apt-get install -y geoip-bin
          pip install pyyaml requests

      - name: Merge Clash Configs
        run: |
          cat > merge.py << 'EOF'
          import yaml, requests, collections
          import geoip2.database

          # 读取 urls.txt 文件
          urls = []
          try:
              with open("urls.txt", "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          urls.append(line)
          except FileNotFoundError:
              print("❌ urls.txt not found!")
              exit(1)

          merged_proxies = []
          merged_rules = []
          merged_groups = {}

          # GeoIP 查询函数，用于获取国家名称
          def get_country_name(ip):
              try:
                  with geoip2.database.Reader('/usr/share/GeoIP/GeoLite2-Country.mmdb') as reader:
                      response = reader.country(ip)
                      return response.country.name
              except Exception as e:
                  print(f"❌ Error with GeoIP service: {e}")
                  return None

          def rename_if_exists(items, name):
              base = name
              i = 1
              while any(x["name"] == name for x in items):
                  name = f"{base}-{i}"
                  i += 1
              return name

          def safe_request(url):
              try:
                  r = requests.get(url, timeout=10)
                  if r.status_code == 200:
                      return r.text
              except:
                  return None
              return None

          print("Downloading and merging configurations...")
          for url in urls:
              text = safe_request(url)
              if not text:
                  print("❌ Skip invalid URL:", url)
                  continue
              try:
                  data = yaml.safe_load(text)
                  if not isinstance(data, dict):
                      print("❌ Invalid YAML:", url)
                      continue
              except:
                  print("❌ Failed to parse YAML:", url)
                  continue

              # Merge proxies
              if "proxies" in data:
                  for p in data["proxies"]:
                      # Check if the server IP is already in merged proxies
                      existing = next((item for item in merged_proxies if item.get("server") == p.get("server")), None)
                      if existing:
                          continue  # Skip if the server IP already exists
                      # Resolve country name based on server IP or domain
                      country = get_country_name(p.get("server", ""))
                      if country:
                          p_copy = p.copy()
                          p_copy["name"] = f"{country}-{rename_if_exists(merged_proxies, country)}"
                          merged_proxies.append(p_copy)

              # Merge rules
              if "rules" in data:
                  merged_rules.extend(data["rules"])

              # Merge proxy-groups
              if "proxy-groups" in data:
                  for g in data["proxy-groups"]:
                      g_name = g.get("name")
                      if g_name not in merged_groups:
                          merged_groups[g_name] = g.copy()
                      else:
                          pass  # If group exists, skip

          # 去重 rules
          dedup_rules = list(collections.OrderedDict.fromkeys(merged_rules))

          # 注入所有节点到 proxy-groups
          proxy_names = [p["name"] for p in merged_proxies]
          for g_name, g in merged_groups.items():
              g_type = g.get("type", "").upper()
              if g_type in ["SELECT", "URL-TEST", "FALLBACK", "LOAD-BALANCE"]:
                  g["proxies"] = proxy_names

          final = {
              "proxies": merged_proxies,
              "proxy-groups": list(merged_groups.values()),
              "rules": dedup_rules
          }

          # Write the merged final YAML file
          with open("final.yaml", "w", encoding="utf-8") as f:
              yaml.dump(final, f, allow_unicode=True, sort_keys=False)

          print("✔ final.yaml generated (merged proxies, rules, proxy-groups)")
          EOF

      - name: Run merge script
        run: python3 merge.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add final.yaml
          git commit -m "Auto update final.yaml (merged proxies, rules, proxy-groups)" || echo "No changes"
          git push
