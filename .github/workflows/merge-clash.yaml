name: Merge Clash Nodes

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间 7:00
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml geoip2 dnspython

      - name: Merge nodes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os, sys, gzip, shutil, socket, requests, yaml, geoip2.database
          from collections import OrderedDict

          # ---------- 配置 ----------
          GEOIP_URL = "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb.gz"
          GEOIP_GZ = "GeoLite2-Country.mmdb.gz"
          GEOIP_DB = "GeoLite2-Country.mmdb"

          # 国家代码映射（仅保留常用，可自行扩展）
          COUNTRY_NAMES = {
              'CN': '中国', 'US': '美国', 'JP': '日本', 'KR': '韩国', 'HK': '香港', 'TW': '台湾',
              'SG': '新加坡', 'GB': '英国', 'DE': '德国', 'FR': '法国', 'CA': '加拿大', 'AU': '澳大利亚',
              'RU': '俄罗斯', 'IN': '印度', 'BR': '巴西', 'ZA': '南非', 'IT': '意大利', 'ES': '西班牙',
              'NL': '荷兰', 'SE': '瑞典', 'NO': '挪威', 'DK': '丹麦', 'FI': '芬兰', 'CH': '瑞士',
              'BE': '比利时', 'AT': '奥地利', 'PL': '波兰', 'CZ': '捷克', 'HU': '匈牙利', 'TR': '土耳其',
              'TH': '泰国', 'VN': '越南', 'MY': '马来西亚', 'ID': '印度尼西亚', 'PH': '菲律宾', 'AE': '阿联酋',
              'SA': '沙特阿拉伯', 'IL': '以色列', 'EG': '埃及', 'NG': '尼日利亚', 'MX': '墨西哥',
              # 其他请根据需要补充
          }

          # ---------- 下载 GeoIP ----------
          if not os.path.exists(GEOIP_DB):
              print("下载 GeoIP 数据库...")
              try:
                  r = requests.get(GEOIP_URL, timeout=30, stream=True)
                  r.raise_for_status()
                  with open(GEOIP_GZ, 'wb') as f:
                      for chunk in r.iter_content(chunk_size=8192):
                          f.write(chunk)
                  with gzip.open(GEOIP_GZ, 'rb') as f_in, open(GEOIP_DB, 'wb') as f_out:
                      shutil.copyfileobj(f_in, f_out)
                  os.remove(GEOIP_GZ)
                  print("GeoIP 数据库下载并解压完成")
              except Exception as e:
                  print(f"GeoIP 下载失败: {e}")
                  sys.exit(1)

          reader = geoip2.database.Reader(GEOIP_DB)

          def get_country_name(server):
              try:
                  # 判断是否为 IP
                  ip = server
                  try:
                      socket.inet_aton(server)
                  except socket.error:
                      # 解析域名
                      ip = socket.gethostbyname(server)
                  response = reader.country(ip)
                  code = response.country.iso_code
                  return COUNTRY_NAMES.get(code, code)  # 未映射则返回代码
              except Exception as e:
                  print(f"  国家查询失败 ({server}): {e}")
                  return None

          # ---------- 读取 urls.txt ----------
          urls_file = "urls.txt"
          if not os.path.exists(urls_file):
              print("未找到 urls.txt，退出")
              sys.exit(1)

          with open(urls_file, 'r', encoding='utf-8') as f:
              urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]

          merged_proxies = []
          seen_servers = set()
          country_counter = {}
          final_config = None
          first_config_loaded = False

          for url in urls:
              print(f"处理: {url}")
              try:
                  resp = requests.get(url, timeout=30)
                  resp.raise_for_status()
                  data = yaml.safe_load(resp.text)
                  if not data:
                      print("  空内容，跳过")
                      continue

                  if not first_config_loaded:
                      final_config = data
                      final_config['proxies'] = []
                      final_config['proxy-groups'] = []
                      first_config_loaded = True

                  if 'proxies' in data and isinstance(data['proxies'], list):
                      for proxy in data['proxies']:
                          server = proxy.get('server')
                          if not server:
                              # 没有 server 的节点保留原样
                              merged_proxies.append(proxy.copy())
                              continue

                          server_key = server.strip().lower()
                          if server_key in seen_servers:
                              print(f"  跳过重复 server: {server}")
                              continue
                          seen_servers.add(server_key)

                          country = get_country_name(server)
                          if country is None:
                              new_name = proxy.get('name', 'Unknown')
                          else:
                              if country not in country_counter:
                                  country_counter[country] = 0
                              country_counter[country] += 1
                              new_name = country if country_counter[country] == 1 else f"{country}{country_counter[country]}"

                          new_proxy = proxy.copy()
                          new_proxy['name'] = new_name
                          merged_proxies.append(new_proxy)
                  else:
                      print("  无 proxies 字段或格式错误")
              except Exception as e:
                  print(f"  处理失败: {e}")
                  continue

          if not merged_proxies:
              print("未获取到任何有效节点，退出")
              sys.exit(1)

          # 生成 proxy-group
          proxy_names = [p['name'] for p in merged_proxies if 'name' in p]
          default_group = {
              'name': 'Proxy',
              'type': 'select',
              'proxies': proxy_names
          }

          if final_config:
              final_config['proxies'] = merged_proxies
              final_config['proxy-groups'] = [default_group]
          else:
              final_config = {
                  'proxies': merged_proxies,
                  'proxy-groups': [default_group],
                  'rules': []
              }

          with open('final.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(final_config, f, allow_unicode=True, sort_keys=False)

          print(f"生成 final.yaml，共 {len(merged_proxies)} 个节点")
          reader.close()
          EOF

      - name: Commit and push
        run: |
          # 确保 final.yaml 存在
          if [ ! -f final.yaml ]; then
            echo "final.yaml 不存在，退出"
            exit 1
          fi
          # 显示文件前几行以便调试
          head -n 10 final.yaml
          # 设置远程 URL 使用 token
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add final.yaml
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "final.yaml 内容未变，无需提交"
          else
            git commit -m "Auto merge Clash nodes at $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:${{ github.ref_name }}
            echo "已推送到仓库"
          fi
