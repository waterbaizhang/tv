name: Merge Clash YAML Configuration

on:
  schedule:
    - cron: '0 23 * * *'  # UTC时间，每天北京时间7点执行一次
  workflow_dispatch:  # 支持手动触发

jobs:
  merge-yaml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install pyyaml requests geoip2

      - name: Run Python Script to Merge YAML
        run: |
          python3 -c "
import os
import yaml
import requests
import geoip2.database
from collections import defaultdict

# 定义文件路径
urls_file = 'urls.txt'
final_yaml = 'final.yaml'

# 下载YAML文件函数
def download_yaml(url):
    try:
        response = requests.get(url)
        response.raise_for_status()
        return yaml.safe_load(response.text)
    except requests.RequestException:
        print(f'Failed to download {url}, skipping...')
        return None

# 从urls.txt读取所有URL
with open(urls_file, 'r') as f:
    urls = [line.strip() for line in f.readlines()]

# 初始化合并的proxies和proxy-groups
proxies = []
proxy_groups = {'proxy-groups': [{'name': 'Proxy Group', 'type': 'select', 'proxies': []}]}
seen_servers = set()

# IP到国家名解析函数
def get_country_name_from_ip(ip):
    try:
        client = geoip2.database.Reader('/usr/share/GeoIP2-City.mmdb')
        response = client.city(ip)
        country = response.country.name
        return country
    except Exception:
        return 'Unknown'

# 合并所有YAML文件
for url in urls:
    yaml_data = download_yaml(url)
    if yaml_data is None:
        continue

    for proxy in yaml_data.get('proxies', []):
        server = proxy.get('server')
        if server and server not in seen_servers:
            country_name = get_country_name_from_ip(server)
            name = f"{country_name}"
            # 如果已经有这个国家名，自动加1
            count = sum(1 for p in proxies if p['name'] == name)
            if count > 0:
                name = f"{country_name} ({count+1})"
            proxy['name'] = name
            seen_servers.add(server)
            proxies.append(proxy)

# 合并到proxy-groups
proxy_groups['proxy-groups'][0]['proxies'] = [p['name'] for p in proxies]

# 如果final.yaml存在，覆盖它
final_config = {'proxies': proxies, **proxy_groups}

# 输出合并后的final.yaml
with open(final_yaml, 'w', encoding='utf-8') as f:
    yaml.dump(final_config, f, allow_unicode=True)

# 推送更新到GitHub
os.system('git config --global user.name "GitHub Actions"')
os.system('git config --global user.email "actions@github.com"')
os.system('git add .')
os.system('git commit -m "Update final.yaml"')
os.system('git push origin main')
          "
