name: Merge Clash Configurations

on:
  schedule:
    - cron: '0 23 * * *' # UTC时间每天7点执行 (北京时间7点对应UTC时间23点)
  workflow_dispatch: # 支持手动触发

jobs:
  merge-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyyaml requests geoip2

      - name: Merge YAML files and generate final.yaml
        run: |
          import os
          import yaml
          import requests
          from geoip import geolite2
          from collections import defaultdict

          # Helper function to resolve country name from IP or domain using GeoIP
          def resolve_country(ip):
              match = geolite2.lookup(ip)
              return match.country if match else 'Unknown'

          # Read URLs from urls.txt
          def read_urls():
              urls = []
              with open('urls.txt', 'r') as file:
                  for line in file:
                      urls.append(line.strip())
              return urls

          # Download YAML files from URLs
          def download_yaml(url):
              try:
                  response = requests.get(url, timeout=10)
                  response.raise_for_status()
                  return yaml.safe_load(response.text)
              except requests.RequestException as e:
                  print(f"Failed to download {url}: {e}")
                  return None

          # Merge proxies nodes
          def merge_proxies(proxies_list):
              proxies_map = {}
              for proxy in proxies_list:
                  if proxy.get('server') and proxy['server'] not in proxies_map:
                      country = resolve_country(proxy['server'])
                      proxy['name'] = f"{country}节点"  # 设置国家名
                      proxies_map[proxy['server']] = proxy
              return list(proxies_map.values())

          # Read URLs and download YAML files
          urls = read_urls()
          all_proxies = []
          for url in urls:
              config = download_yaml(url)
              if config:
                  all_proxies.extend(config.get('proxies', []))

          # Merge proxies and create final configuration
          merged_proxies = merge_proxies(all_proxies)
          proxy_groups = {
              'name': 'Proxy Group',
              'type': 'select',
              'proxies': [proxy['name'] for proxy in merged_proxies]
          }

          final_config = {
              'proxies': merged_proxies,
              'proxy-groups': [proxy_groups],
              'geoip': {'enabled': True},
          }

          # Write the final YAML to a file
          with open('final.yaml', 'w', encoding='utf-8') as file:
              yaml.dump(final_config, file, allow_unicode=True, default_flow_style=False)

      - name: Commit and push final.yaml
        uses: EndBug/add-and-commit@v7
        with:
          author_name: 'GitHub Actions'
          author_email: 'github-actions@github.com'
          message: 'Update final.yaml with merged proxies and proxy groups'
          add: 'final.yaml'
