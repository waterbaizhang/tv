name: Generate Clash Subscription

on:
  push:
    paths:
      - 'clash.txt'
  workflow_dispatch:

permissions:
  contents: write  # 允许 push 回仓库

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # 使用 GITHUB_TOKEN 推送

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Generate Clash Subscription
        run: |
          python generate_clash.py

      - name: Commit and Push
        run: |
          git add clash.yaml
          git commit -m "Update Clash subscription" || echo "⚠️ No changes"
          git push
