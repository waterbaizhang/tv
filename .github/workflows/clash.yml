name: Merge YAML Files

on:
  push:
    branches:
      - main  # 或你希望触发的分支
  workflow_dispatch:  # 允许手动触发

jobs:
  merge-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: clash
        id: read-urls
        run: |
          echo "URLS<<EOF" >> $GITHUB_ENV
          cat clash.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download and merge YAML files
        run: |
          mkdir -p output
          > mate.yaml  # 创建空文件
          while IFS= read -r url; do
            if [[ -n "$url" && "$url" != "#"* ]]; then
              echo "Downloading: $url"
              curl -sSL "$url" >> mate.yaml
              echo "" >> mate.yaml  # 添加空行分隔（可选）
            fi
          done <<< "$URLS"

      - name: Save mate file to repo (optional)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add mate.yaml
          git commit -m "Update mate.yaml" || echo "No changes to commit"
          git push
